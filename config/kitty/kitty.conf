# ⚡ xLFr4n // Kali BSPWM 2026
# Daily-driver Kitty profile: clean cyber-red glass, responsive input, useful tabs
# and subtle cursor animation without heavy effects.

font_family JetBrains Mono
font_size 11.0
bold_font auto
italic_font auto
bold_italic_font auto
disable_ligatures never

background #101216
foreground #f0f3f7
cursor #ff3344
cursor_text_color #101216
selection_background #ff3344
selection_foreground #101216
background_opacity 0.96
dynamic_background_opacity yes

window_padding_width 10
window_margin_width 2
single_window_padding_width -1
single_window_margin_width -1
hide_window_decorations yes
draw_minimal_borders yes
window_border_width 1
window_border_radius 8
active_border_color #ff3344
inactive_border_color #262a31
placement_strategy center
padding_fill_strategy background
remember_window_size yes
remember_window_position no
initial_window_width 118c
initial_window_height 34c
confirm_os_window_close 0

enable_audio_bell no
visual_bell_duration 0
cursor_shape block
cursor_shape_unfocused hollow
cursor_blink_interval 0.5 ease-in-out
cursor_stop_blinking_after 15
cursor_trail 20
cursor_trail_decay 0.08 0.20
cursor_trail_start_threshold 1
cursor_trail_color #ff3344

scrollback_lines 10000
scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER
scrollback_pager_history_size 32
scrollbar hovered
wheel_scroll_multiplier 4.0
shell_integration enabled no-cursor
allow_hyperlinks yes
allow_remote_control no
linux_display_server x11

repaint_delay 8
input_delay 2
sync_to_monitor yes

tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_margin_width 8
tab_bar_margin_height 3 3
tab_bar_align left
tab_bar_min_tabs 2
tab_bar_show_new_tab_button no
active_tab_foreground #101216
active_tab_background #ff3344
inactive_tab_foreground #7d8590
inactive_tab_background #151920
tab_separator " · "
tab_activity_symbol " ◇"
tab_title_template "{index}: {title}"
tab_title_max_length 42

# Useful Kitty-native navigation.
map ctrl+shift+t new_tab
map ctrl+shift+q close_tab
map ctrl+shift+right next_tab
map ctrl+shift+left previous_tab
map ctrl+shift+n new_window_with_cwd
map ctrl+shift+w close_window
map ctrl+shift+/ search_scrollback
map ctrl+shift+alt+r load_config_file
map ctrl+shift+plus change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+backspace restore_font_size
