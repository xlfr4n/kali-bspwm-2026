# ⚡ xlfr4n // Kali BSPWM 2026
font_family JetBrains Mono
font_size 11.0
bold_font auto
italic_font auto
bold_italic_font auto

background #101216
foreground #f0f3f7
cursor #ff3344
cursor_text_color #101216
selection_background #ff3344
selection_foreground #101216
background_opacity 0.94
dynamic_background_opacity yes

window_padding_width 10
window_margin_width 2
hide_window_decorations yes
draw_minimal_borders yes
window_border_width 1
confirm_os_window_close 0
enable_audio_bell no
visual_bell_duration 0
cursor_shape block
cursor_blink_interval 0.55
scrollback_lines 10000
shell_integration enabled
allow_remote_control no
linux_display_server x11

tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
active_tab_foreground #101216
active_tab_background #ff3344
inactive_tab_foreground #7d8590
inactive_tab_background #151920
tab_separator " · "
tab_title_template "{index}: {title}"
