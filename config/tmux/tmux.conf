# ⚡ xLFr4n // tmux profile
# Persistent terminal workspace for authorized red-team / pentest lab work.
# This file configures the multiplexer; it executes no security tooling.

set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g mouse on
set -g history-limit 50000
set -g escape-time 0
set -g focus-events on
set -g xterm-keys on
set -g default-terminal "tmux-256color"
set -s set-clipboard external
set -as terminal-features ",xterm-ghostty:RGB,clipboard"

setw -g mode-keys vi
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Enter send -X copy-selection-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-and-cancel

# Copy the entire active pane history (tmux scrollback) to the X11 clipboard.
bind A run-shell -b "tmux capture-pane -JpS - | xclip -selection clipboard -i" \; display-message "⚡ xLFr4n // full pane copied"
set -g status-position bottom
set -g status-interval 2
set -g status-left-length 32
set -g status-right-length 64
set -g status-left " ⚡ xLFr4n "
set -g status-right " #[fg=colour245]#S · #H · %Y-%m-%d %H:%M "
set -g window-status-format " #I:#W "
set -g window-status-current-format " #[fg=colour203,bold]#I:#W#[default] "
set -g pane-border-status top
set -g pane-border-format " #{?pane_active,#[fg=colour203],#[fg=colour245]}#{pane_index}: #{pane_title} #[default]"

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind H resize-pane -L 5
bind J resize-pane -D 3
bind K resize-pane -U 3
bind L resize-pane -R 5

bind y set-window-option synchronize-panes
bind r source-file ~/.config/tmux/tmux.conf \; display-message "⚡ xLFr4n // tmux reloaded"

set -g remain-on-exit off
