# ⚡ xlfr4n // Kali BSPWM 2026
shadow = true;
shadow-radius = 14;
shadow-opacity = 0.32;
shadow-offset-x = -1;
shadow-offset-y = 5;
inactive-opacity = 0.96;
active-opacity = 1.0;
frame-opacity = 1.0;
fading = true;
fade-in-step = 0.08;
fade-out-step = 0.08;
fade-delta = 8;
corner-radius = 8;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'Polybar'",
  "class_g = 'Rofi'",
  "class_g = 'Dunst'",
  "class_g = 'Tint2'",
  "window_type = 'dock'",
];
shadow-exclude = [
  "window_type = 'dock'",
  "class_g = 'Polybar'",
  "class_g = 'Dunst'",
  "class_g = 'Tint2'"
];
fade-exclude = [
  "window_type = 'dock'",
  "class_g = 'Polybar'",
  "class_g = 'Tint2'"
];
vsync = true;
use-damage = true;
detect-rounded-corners = true;
detect-client-opacity = true;
# Keep compositor effects VM-friendly: no background blur, but retain smooth fades and shadows.
# Blur is intentionally disabled for VM compatibility.


# Transient/client-leader detection improves dialogs and short-lived overlays.
detect-transient = true;
detect-client-leader = true;
