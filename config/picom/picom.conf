# ⚡ xlfr4n // Kali BSPWM 2026
shadow = true;
shadow-radius = 12;
shadow-opacity = 0.25;
shadow-offset-x = -4;
shadow-offset-y = -4;
fading = true;
fade-in-step = 0.08;
fade-out-step = 0.08;
corner-radius = 8;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'Polybar'",
  "class_g = 'Rofi'",
  "class_g = 'Dunst'"
];
vsync = true;
detect-rounded-corners = true;
detect-client-opacity = true;
# Blur is intentionally disabled for VM compatibility.
