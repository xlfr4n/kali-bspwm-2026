# ⚡ xlfr4n // Kali BSPWM 2026
# Personal desktop identity: the top bar is the control surface.

[colors]
bg = #101216
panel = #151920
panel-2 = #1b2028
fg = #f0f3f7
muted = #7d8590
accent = #ff3344
good = #5ee881
warn = #ffc857
blue = #70a9ff
glass = #E50B0E12
glass-2 = #D9161B22
border = #55ff3344

[bar/main]
width = 96%
height = 28pt
offset-x = 3%
offset-y = 8pt
background = ${colors.glass}
foreground = ${colors.fg}
radius = 14
line-size = 1pt
line-color = ${colors.accent}
border-size = 1pt
border-color = ${colors.border}
padding-left = 1
padding-right = 1
module-margin-left = 1
module-margin-right = 1
override-redirect = false
fixed-center = true
cursor-click = pointer
font-0 = JetBrains Mono:size=10;2
font-1 = Font Awesome 6 Free:style=Solid:size=11;3
wm-restack = bspwm
enable-ipc = true
screenchange-reload = true
modules-left = identity launcher target
modules-center = xwindow
modules-right = vpn network cpu memory filesystem pulseaudio virt uptime
separator =
separator-foreground = ${colors.muted}
tray-position = none
tray-maxsize = 18
tray-padding = 1
tray-background = ${colors.panel-2}

[module/identity]
type = custom/text
content = "⚡ xLFr4n // KALI"
content-foreground = ${colors.accent}
content-background = ${colors.panel}
content-padding = 1
click-left = kali-menu

[module/launcher]
type = custom/text
content = "⌘ APPS"
content-foreground = ${colors.fg}
content-background = ${colors.panel-2}
content-padding = 1
click-left = rofi-xlfr4n -show drun -show-icons

[module/mission]
type = custom/text
content = "◉ WINDOWS"
content-foreground = ${colors.fg}
content-background = ${colors.panel}
content-padding = 1
click-left = mission-control

[module/dock]
type = custom/text
content = "⌄ DOCK"
content-foreground = ${colors.fg}
content-background = ${colors.panel-2}
content-padding = 1
click-left = dock --toggle

[module/brave]
type = custom/text
content = "◉ BRAVE"
content-foreground = ${colors.accent}
content-background = ${colors.panel}
content-padding = 1
click-left = brave-browser --new-window

[module/target]
type = custom/script
exec = ~/.local/bin/settarget --status
interval = 2
format = <label>
format-foreground = ${colors.accent}
label = %output%

[module/vpn]
type = custom/script
exec = sh -c 'ip -br a 2>/dev/null | awk '\''$1 ~ /^(tun|wg)/ {print "VPN " $1 " " $3}'\'' | head -1'
interval = 3
format = <label>
format-foreground = ${colors.good}
label = %output%

[module/virt]
type = custom/script
exec = sh -c 'v=$(systemd-detect-virt 2>/dev/null || echo bare); case "$v" in vmware) echo "VMWARE";; oracle|virtualbox) echo "VBOX";; none) echo "HOST";; *) echo "$v";; esac'
interval = 30
format = <label>
format-foreground = ${colors.blue}
label = %output%

[module/session]
type = custom/text
content = "BSPWM // X11"
content-foreground = ${colors.muted}
content-padding = 1

[module/bspwm]
type = internal/bspwm
label-focused = "  %name%  "
label-focused-foreground = ${colors.bg}
label-focused-background = ${colors.accent}
label-focused-padding = 0
label-occupied = "  %name%  "
label-occupied-foreground = ${colors.fg}
label-occupied-padding = 0
label-empty = "  %name%  "
label-empty-foreground = ${colors.muted}
label-empty-padding = 0

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "%{T2}%{T-} "
label = %percentage:2%%

[module/memory]
type = internal/memory
interval = 2
format-prefix = "%{T2}%{T-} "
label = %percentage_used:2%%

[module/filesystem]
type = internal/fs
mount-0 = /
interval = 30
format-mounted-prefix = "%{T2}%{T-} "
label-mounted = %percentage_used%%

[module/network]
type = internal/network
interface-type = wired
interval = 3
format-connected-prefix = "%{T2}%{T-} "
format-disconnected-prefix = "%{T2}%{T-} "
label-connected = %local_ip%
label-disconnected = "offline"
label-connected-foreground = ${colors.good}
label-disconnected-foreground = ${colors.warn}
click-left = nm-connection-editor


[module/uptime]
type = custom/script
exec = sh -c 'uptime -p 2>/dev/null | sed -E "s/^up //; s/, / · /g"'
interval = 30
format = <label>
format-prefix = "%{T2}%{T-} "
label = %output%
label-foreground = ${colors.muted}
[module/pulseaudio]
type = internal/pulseaudio
interval = 2
format-volume-prefix = "%{T2}%{T-} "
format-volume = <label-volume>
label-volume = %percentage%%
label-muted = "MUTE"
label-muted-foreground = ${colors.warn}
click-right = pavucontrol

[module/xwindow]
type = internal/xwindow
label = %title:0:42:...%
label-foreground = ${colors.muted}

[module/date]
type = internal/date
interval = 1
date = %d/%m/%Y  •  %H:%M
label = %date%

[module/power]
type = custom/text
content = " PWR "
content-foreground = ${colors.bg}
content-background = ${colors.accent}
content-padding = 1
click-left = power-menu

[global/wm]
margin-bottom = 44pt
margin-top = 16pt


[bar/workspace]
width = 96%
height = 30pt
offset-x = 2%
offset-y = 8pt
bottom = true
background = #00000000
foreground = ${colors.fg}
radius = 0
line-size = 0pt
border-size = 0pt
padding-left = 0
padding-right = 0
module-margin-left = 1
module-margin-right = 1
override-redirect = false
fixed-center = true
cursor-click = pointer
font-0 = JetBrains Mono:size=9;2
font-1 = Font Awesome 6 Free:style=Solid:size=10;3
wm-restack = bspwm
enable-ipc = true
modules-left = bspwm
modules-right = date
tray-position = none

[bar/dock]
width = 50%
height = 50pt
offset-x = 25%
offset-y = 6pt
bottom = true
background = ${colors.glass}
foreground = ${colors.fg}
radius = 18
line-size = 1pt
line-color = ${colors.accent}
border-size = 1pt
border-color = ${colors.border}
padding-left = 2
padding-right = 2
module-margin-left = 2
module-margin-right = 2
override-redirect = false
fixed-center = true
font-0 = Font Awesome 6 Free:style=Solid:size=13;3
font-1 = JetBrains Mono:size=9;2
wm-restack = bspwm
enable-ipc = true
cursor-click = pointer
modules-center = dock-menu dock-brave dock-kitty dock-files dock-code dock-burp dock-nvim dock-lab dock-target
tray-position = none

[module/dock-menu]
type = custom/text
content = "%{T2}%{T-}"
content-foreground = ${colors.accent}
click-left = kali-menu

[module/dock-brave]
type = custom/text
content = "%{T2}%{T-}"
content-foreground = ${colors.fg}
click-left = brave-browser --new-window

[module/dock-kitty]
type = custom/text
content = "%{T2}%{T-}"
content-foreground = ${colors.fg}
click-left = kitty

[module/dock-files]
type = custom/text
content = "%{T2}%{T-}"
content-foreground = ${colors.fg}
click-left = thunar

[module/dock-code]
type = custom/text
content = "%{T2}%{T-}"
content-foreground = ${colors.fg}
click-left = code

[module/dock-burp]
type = custom/text
content = "%{T2}%{T-}"
content-foreground = ${colors.fg}
click-left = burpsuite

[module/dock-nvim]
type = custom/text
content = "%{T2}%{T-}"
content-foreground = ${colors.fg}
click-left = kitty --class floating_nvim -e nvim

[module/dock-lab]
type = custom/text
content = "%{T2}%{T-}"
content-foreground = ${colors.accent}
click-left = kitty --title Kali-Lab -e lab

[module/dock-target]
type = custom/text
content = "%{T2}%{T-}"
content-foreground = ${colors.accent}
click-left = settarget
