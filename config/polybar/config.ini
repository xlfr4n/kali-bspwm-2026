[colors]
bg = #101216
fg = #f0f3f7
muted = #7d8590
accent = #ff3344
good = #5ee881
warn = #ffc857

[bar/main]
width = 100%
height = 28pt
background = ${colors.bg}
foreground = ${colors.fg}
line-size = 2pt
padding-left = 1
padding-right = 1
module-margin = 1
font-0 = JetBrains Mono:size=10;2
font-1 = Font Awesome 6 Free:size=10;2
modules-left = launcher target vpn
modules-center = bspwm
modules-right = cpu memory filesystem network pulseaudio date power
separator = |
separator-foreground = ${colors.muted}

[module/launcher]
type = custom/text
content = ""
content-foreground = ${colors.accent}
click-left = rofi -show drun -theme ~/.config/rofi/launcher.rasi

[module/target]
type = custom/script
exec = ~/.local/bin/settarget --status
interval = 2
format = <label>
format-foreground = ${colors.accent}

[module/vpn]
type = custom/script
exec = sh -c 'ip -br a 2>/dev/null | awk '\''$1 ~ /^(tun|wg)/ {print "VPN " $1 " " $3}'\'' | head -1'
interval = 3
format = <label>
format-foreground = ${colors.good}

[module/bspwm]
type = internal/bspwm
label-focused = %name%
label-focused-foreground = ${colors.accent}
label-focused-padding = 1
label-occupied = %name%
label-occupied-padding = 1
label-empty = %name%
label-empty-foreground = ${colors.muted}
label-empty-padding = 1

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "CPU "
label = %percentage:2%%

[module/memory]
type = internal/memory
interval = 2
format-prefix = "RAM "
label = %percentage_used:2%%

[module/filesystem]
type = internal/fs
mount-0 = /
interval = 30
format-mounted-prefix = "DISK "
label-mounted = %percentage_used%%

[module/network]
type = internal/network
interface-type = wireless
interval = 3
format-connected-prefix = "NET "
label-connected = %signal%%
label-disconnected = "NET -"

[module/pulseaudio]
type = internal/pulseaudio
format-volume-prefix = "VOL "
format-volume = <label-volume>
label-volume = %percentage%%
label-muted = "MUTE"
label-muted-foreground = ${colors.warn}
click-right = pavucontrol

[module/date]
type = internal/date
interval = 1
date = %d/%m/%Y  %H:%M
label = %date%

[module/power]
type = custom/text
content = "⏻"
content-foreground = ${colors.accent}
click-left = power-menu
