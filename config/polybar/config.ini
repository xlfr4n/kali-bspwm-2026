# ⚡ xlfr4n // Kali BSPWM 2026

[colors]
bg = #101216
panel = #151920
fg = #f0f3f7
muted = #7d8590
accent = #ff3344
good = #5ee881
warn = #ffc857
blue = #70a9ff

[bar/main]
width = 100%
height = 28pt
background = ${colors.bg}
foreground = ${colors.fg}
line-size = 2pt
border-size = 0
padding-left = 1
padding-right = 1
module-margin-left = 1
module-margin-right = 1
font-0 = JetBrains Mono:size=10;2
wm-restack = bspwm
enable-ipc = true
modules-left = launcher target vpn virt
modules-center = bspwm
modules-right = cpu memory filesystem network pulseaudio xwindow date power
separator = |
separator-foreground = ${colors.muted}
tray-position = right
tray-maxsize = 16

[module/launcher]
type = custom/text
content = "XL"
content-foreground = ${colors.accent}
content-padding = 1
click-left = kali-menu

[module/target]
type = custom/script
exec = ~/.local/bin/settarget --status
interval = 2
format = <label>
format-foreground = ${colors.accent}
label = TARGET %output%

[module/vpn]
type = custom/script
exec = sh -c 'ip -br a 2>/dev/null | awk '\''$1 ~ /^(tun|wg)/ {print "VPN " $1 " " $3}'\'' | head -1'
interval = 3
format = <label>
format-foreground = ${colors.good}
label = %output%

[module/virt]
type = custom/script
exec = sh -c 'v=$(systemd-detect-virt 2>/dev/null || echo bare); case "$v" in vmware) echo "VMWARE";; oracle|virtualbox) echo "VBOX";; none) echo "HOST";; *) echo "$v";; esac'
interval = 30
format = <label>
format-foreground = ${colors.blue}

[module/bspwm]
type = internal/bspwm
label-focused = %name%
label-focused-foreground = ${colors.accent}
label-focused-padding = 1
label-occupied = %name%
label-occupied-foreground = ${colors.fg}
label-occupied-padding = 1
label-empty = %name%
label-empty-foreground = ${colors.muted}
label-empty-padding = 1

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "CPU "
label = %percentage:2%%

[module/memory]
type = internal/memory
interval = 2
format-prefix = "RAM "
label = %percentage_used:2%%

[module/filesystem]
type = internal/fs
mount-0 = /
interval = 30
format-mounted-prefix = "DISK "
label-mounted = %percentage_used%%

[module/network]
type = internal/network
interface-type = wired
interval = 3
format-connected-prefix = "NET "
label-connected = %ifname% %local_ip%
label-disconnected = "NET -"

[module/pulseaudio]
type = internal/pulseaudio
interval = 2
format-volume-prefix = "VOL "
format-volume = <label-volume>
label-volume = %percentage%%
label-muted = "MUTE"
label-muted-foreground = ${colors.warn}
click-right = pavucontrol

[module/xwindow]
type = internal/xwindow
label = %title:0:42:...%
label-foreground = ${colors.muted}

[module/date]
type = internal/date
interval = 1
date = %d/%m/%Y  %H:%M
label = %date%

[module/power]
type = custom/text
content = "PWR"
content-foreground = ${colors.accent}
content-padding = 1
click-left = power-menu
