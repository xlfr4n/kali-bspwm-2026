name: shellcheck

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install ShellCheck and Rofi
        run: sudo apt-get update && sudo apt-get install -y shellcheck rofi xvfb
      - name: Bash syntax and static guards
        run: bash tests/static.sh
      - name: Validate Rofi theme
        run: xvfb-run -a rofi -no-config -theme config/rofi/launcher.rasi -dump-theme >/dev/null
      - name: Check shell scripts
        run: |
          shellcheck install.sh uninstall.sh config/bspwm/bspwmrc config/polybar/launch.sh
          find scripts -maxdepth 1 -type f ! -name 'README.md' -print0 | xargs -0 shellcheck
