name: redteam-lab

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: redteam-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck jq
      - name: Lab asset checks
        run: bash tests/lab-stages.sh
      - name: ShellCheck lab scripts
        run: shellcheck tests/lab-stages.sh tools/web-lab/reset.sh tools/web-lab/test.sh
      - name: Compose validation
        run: docker compose -f tools/web-lab/compose.yml config -q

  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $errors = @()
          Get-ChildItem -Path tools -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $errors += "$($_.FullName): $($parseErrors -join '; ')"
            } else {
              Write-Host "[OK] $($_.FullName)"
            }
          }
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }
          Write-Host 'PowerShell parser validation: PASS'

  web-lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Start Web Lab
        run: docker compose -f tools/web-lab/compose.yml up -d --build
      - name: Wait for health
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          docker compose -f tools/web-lab/compose.yml logs
          exit 1
      - name: Run Web Lab smoke
        run: bash tools/web-lab/test.sh http://127.0.0.1:8080
      - name: Stop Web Lab
        if: always()
        run: docker compose -f tools/web-lab/compose.yml down --remove-orphans
