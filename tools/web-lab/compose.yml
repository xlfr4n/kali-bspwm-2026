services:
  weblab:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: xlfr4n-weblab
    restart: "no"
    environment:
      LAB_PORT: '8080'
      LAB_MODE: isolated-lab
    ports:
      - "${WEB_LAB_BIND:-127.0.0.1}:8080:8080"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
