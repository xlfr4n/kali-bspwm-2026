services:
  weblab:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: xlfr4n-weblab
    restart: unless-stopped
    environment:
      LAB_PORT: '8080'
    ports:
      - '8080:8080'
    healthcheck:
      test: ['CMD', 'python3', '-c', "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 5
    security_opt:
      - no-new-privileges:true
